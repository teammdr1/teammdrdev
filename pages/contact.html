    <main class="container">
        <div class="contact-info">
            <h1>contact</h1>
            <p>
                Contact me only for collabs, ads, business or urgent matters.
            </p>
        </div>
        <div class="contact-form">
            <div class="form-container">
                <h2>send a message</h2>
                <form
                    action="https://api.web3forms.com/submit"
                    method="POST"
                >
                    <input
                        type="hidden"
                        name="access_key"
                        value="4fe9dc8c-0391-4fbc-85e8-ad974f22616c"
                    >
                    <label for="name">
                        name
                    </label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >
                    <label for="email">
                        email
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                    <label for="message">
                        message
                    </label>
                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        required
                    ></textarea>
                    <button type="submit">
                        send
                    </button>
                </form>
                <div class="form-responses">
                    <p class="success-message">
                        Your message has been sent successfully!
                    </p>
                    <p class="error-message">
                        There was an error sending your message. Please try again.
                    </p>
                </div>
            </div>
        </div>
    </main>
    <section class="color-options-container">
        <div class="section-title">
            select theme
        </div>
        <div class="color-options-wrapper">
            <div class="color-options">
                <button
                    class="color-option"
                    data-theme="dark"
                    style="background:#000"
                    aria-label="Dark theme"
                ></button>
                <button
                    class="color-option"
                    data-theme="gray"
                    style="background:#1e1e1e"
                    aria-label="Gray theme"
                ></button>
                <button

                    data-theme="blue"
                    style="background:#0b1220"
                    aria-label="Blue theme"
                ></button>
                <button
                    class="color-option"
                    data-theme="purple"
                    style="background:#120a1f"
                    aria-label="Purple theme"
                ></button>
                <button
                    class="color-option"
                    data-theme="cyber"
                    style="background:#050505"
                    aria-label="Cyber theme"
                ></button>
                <button
                    class="color-option"
                    data-theme="caffee"
                    style="background:#352815"
                    aria-label="Coffee theme"
                ></button>
            </div>
        </div>
